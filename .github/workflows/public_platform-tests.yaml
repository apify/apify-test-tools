name: Platform tests

on:
    workflow_call:
        inputs:
            # Glob of the test files to run, from the repo root, e.g. `test/platform/{hourly,hourly-without-pr}/**`
            test-files-glob:
                type: string
                default: 'test/platform/**'
                required: false
            # Slack channel for failed tests. Empty skips Slack.
            report-slack-channel:
                type: string
                default: ''
                required: false
        # Every secret is optional. The tests run each Actor with its `testTokenEnvVar` from
        # apify-test-tools.config.json, which is its `tokenEnvVar` unless the config names another. Those names
        # differ per repo, so the tokens come packed in CONFIG_SECRETS. Actors whose token isn't passed fall back to
        # TESTER_APIFY_TOKEN. See the Secrets section of docs/workflows.md.
        secrets:
            NPM_TOKEN:
                required: false
                description: Read-only token for installing private npm packages.
            CONFIG_SECRETS:
                required: false
                description: >-
                    JSON object of the secrets apify-test-tools.config.json names, secret name -> value. Here
                    that is each Actor's `testTokenEnvVar`, its `tokenEnvVar` by default. Passing
                    `toJSON(secrets)` works too, only the names the config declares are used.
            TESTER_APIFY_TOKEN:
                required: false
                description: >-
                    Fallback token for the platform tests: used for Actors whose own test token
                    (`testTokenEnvVar`, by default `tokenEnvVar`) isn't passed, and for every Actor by a repo
                    on an apify-test-tools lib older than per-Actor tokens.
            SLACK_BOT_TOKEN:
                required: false
                description: Slack token for reporting test results.

jobs:
    scheduledPlatformTests:
        name: Scheduled Platform tests
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Setup repository and dependencies
              id: setup
              # `$/` loads the action from this repo at the commit this workflow was called at, so a caller
              # pinned to a SHA or a branch gets that commit's action and CLI, not whatever the major tag is on.
              uses: $/.github/actions/checkout-restore-dependencies
              with:
                  npm-token: ${{ secrets.NPM_TOKEN }}
                  config-secrets: ${{ secrets.CONFIG_SECRETS }}

            # Runs the repo's test code and its whole import graph, so it gets only the tokens the tests run the
            # Actors with, see run-with-apify-tokens.mjs, and TESTER_APIFY_TOKEN, which the tests fall back to when an
            # Actor's own token isn't passed.
            # Fails on failing tests, but writes the report anyway for the notification below.
            # Every Actor in the config, on its default build: the one users run
            - name: Test
              id: test
              # bash rather than the default shell, for pipefail
              shell: bash
              env:
                  WORKFLOW_SECRETS: ${{ toJSON(secrets) }}
                  SCRIPTS_PATH: ${{ steps.setup.outputs.scripts-path }}
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
                  # Passed through the environment and quoted, so the shell doesn't expand the glob itself
                  # An empty input, e.g. from an expression that picks the glob, runs everything, like the default
                  TEST_FILES_GLOB: ${{ inputs.test-files-glob || 'test/platform/**' }}
              run: |
                  apify-test-tools get-actor-configs \
                    | node "$SCRIPTS_PATH/run-with-apify-tokens.mjs" --tokens test \
                        apify-test-tools test --test-files-glob "$TEST_FILES_GLOB" \
                        --reporter github-actions --vitest-output-file ./test-output.json > test-report.json

            # Posts only when the tests failed, but checks the Slack token on every run that has a channel. Runs
            # whenever the tests did, also after a failure, but not when an earlier step stopped the job before them.
            - name: Notify
              if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
              env:
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
                  # Passed through the environment, so a quote in the workflow name can't break the command
                  WORKFLOW_NAME: ${{ github.workflow }}
                  JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  # Empty makes notify skip Slack
                  SLACK_CHANNEL: ${{ inputs.report-slack-channel }}
              run: |
                  # Empty when `test` itself failed before running vitest, its error is in the Test step
                  if [ ! -s test-report.json ]; then
                      echo "No test report, so there is nothing to notify about"
                      exit 0
                  fi
                  apify-test-tools notify \
                    --slack-channel "$SLACK_CHANNEL" \
                    --title "$WORKFLOW_NAME" \
                    --job-url "$JOB_URL" \
                    < test-report.json

            - name: Upload test reports
              uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: vitest-results
                  path: |
                      ./test-output.json
                      ./test-report.json
