name: Checkout and restore dependencies
description: Checkout and restore dependencies
inputs:
    npm-token:
        description: >-
            Token for installing private npm packages. Exported as both NPM_TOKEN (what a
            committed .npmrc usually references) and NODE_AUTH_TOKEN (what setup-node's
            generated .npmrc references), and only on the dependency install steps, so it
            never reaches the build or test steps. Use a read-only token.
        required: false
    config-secrets:
        description: >-
            The CONFIG_SECRETS workflow secret, if the caller passed one. Every value inside it is
            registered as a mask, see .github/scripts/mask-config-secrets.sh.
        required: false

outputs:
    scripts-path:
        description: >-
            Absolute path to this repo's scripts/ directory in the runner's action checkout.
            Lets calling workflows run helpers like run-with-apify-tokens.mjs without checking
            this repo out again, since the workspace holds the caller's repo, not this one.
        value: ${{ steps.scripts-path.outputs.path }}

# Sets common steps and ensure we use cached node_modules
# The reusable workflows load this with `uses: $/...`, which resolves to the same commit as the
# workflow itself, so testing a change here only needs the caller pointed at your branch.
runs:
    using: 'composite'
    steps:
        # Runs before anything can use a packed secret, see the script for why.
        - name: Mask config secrets
          if: inputs.config-secrets != ''
          shell: bash
          env:
              CONFIG_SECRETS: ${{ inputs.config-secrets }}
          run: bash "${{ github.action_path }}/../../scripts/mask-config-secrets.sh"

        - name: Checkout Repository
          uses: actions/checkout@v5
          with:
              fetch-depth: 0
              # We want to test our branch, not GitHub's fake merge commit (we must test that before merging anyway)
              # head_ref must be used for pull_request but for push and schedule events we have to use ref to get the branch name
              ref: ${{ github.head_ref || github.ref }}

        - name: Use Node.js 24
          uses: actions/setup-node@v5
          with:
              node-version: 24
              # v5 caches automatically when package.json has a `packageManager` field.
              # The node_modules cache below is the only cache we want.
              package-manager-cache: false

        # `github.action_path` only resolves inside this composite action, but the steps that use
        # .github/scripts/ live in the calling workflows. Resolving it once here and exposing it as
        # an output keeps the scripts readable in place, with no copy into a temp directory.
        # This is not a good place for this but me and Claude didn't figure out a better way.
        - name: Resolve scripts path
          id: scripts-path
          shell: bash
          run: echo "path=$(cd "${{ github.action_path }}/../../scripts" && pwd)" >> "$GITHUB_OUTPUT"

        # A repo is on pnpm when it has a pnpm-lock.yaml and no package-lock.json.
        - name: Detect package manager
          id: package-manager
          shell: bash
          run: |
              if [ -f pnpm-lock.yaml ] && [ ! -f package-lock.json ]; then
                  echo "name=pnpm" >> "$GITHUB_OUTPUT"
              else
                  echo "name=npm" >> "$GITHUB_OUTPUT"
              fi

        # Takes the pnpm version from the `packageManager` field of the repo's package.json.
        - name: Install pnpm
          if: steps.package-manager.outputs.name == 'pnpm'
          uses: pnpm/action-setup@v6

        - name: Cache dependencies npm
          if: steps.package-manager.outputs.name == 'npm'
          id: check-dependencies-cache
          uses: actions/cache@v5
          with:
              path: node_modules
              key: modules-npm-${{ hashFiles('package-lock.json') }}

        - name: install npm dependencies
          if: steps.package-manager.outputs.name == 'npm' && steps.check-dependencies-cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              NPM_TOKEN: ${{ inputs.npm-token }}
              NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
          run: npm ci

        # Caching node_modules would miss each workspace package's own node_modules, so we cache the
        # store and always install; with a warm store that only links files.
        - name: Resolve pnpm store path
          if: steps.package-manager.outputs.name == 'pnpm'
          id: pnpm-store
          shell: bash
          run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

        - name: Cache pnpm store
          if: steps.package-manager.outputs.name == 'pnpm'
          uses: actions/cache@v5
          with:
              path: ${{ steps.pnpm-store.outputs.path }}
              key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

        - name: install pnpm dependencies
          if: steps.package-manager.outputs.name == 'pnpm'
          shell: bash
          env:
              NPM_TOKEN: ${{ inputs.npm-token }}
              NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
          run: pnpm install --frozen-lockfile

        # The CLI the workflows call ships with this action as one bundled file (npm run bundle), so
        # nothing is installed for it. The repo's node_modules stays exactly what its lockfile says,
        # and its tests import the lib from the version they locked.
        # Steps call `apify-test-tools` without npx: npx would pick the repo's own copy in node_modules/.bin first.
        - name: Put apify-test-tools CLI on PATH
          shell: bash
          run: |
              bundle="$(cd "${{ github.action_path }}/../../cli" && pwd)/apify-test-tools.mjs"
              bin_dir="$RUNNER_TEMP/apify-test-tools-bin"
              mkdir -p "$bin_dir"
              printf '#!/bin/sh\nexec node --no-warnings "%s" "$@"\n' "$bundle" > "$bin_dir/apify-test-tools"
              chmod +x "$bin_dir/apify-test-tools"
              echo "$bin_dir" >> "$GITHUB_PATH"
