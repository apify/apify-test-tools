name: Checkout and restore dependencies
description: Checkout and restore dependencies
inputs:
    npm-token:
        description: >-
            Token for installing private npm packages. Exported as both NPM_TOKEN (what a
            committed .npmrc usually references) and NODE_AUTH_TOKEN (what setup-node's
            generated .npmrc references), and only on the dependency install steps, so it
            never reaches the build or test steps. Use a read-only token.
        required: false

outputs:
    scripts-path:
        description: >-
            Absolute path to this repo's scripts/ directory in the runner's action checkout.
            Lets calling workflows run helpers like run-with-apify-tokens.mjs without checking
            this repo out again, since the workspace holds the caller's repo, not this one.
        value: ${{ steps.scripts-path.outputs.path }}

# Sets common steps and ensure we use cached node_modules
# To test a change here, repoint the `uses:` refs in the reusable workflows at your branch, and
# change them back before merging. Merging to master no longer ships it: consumers track the `workflows-v0`
# tag, which only moves once the package version in .github/workflows-package-version is on npm.
runs:
    using: 'composite'
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v5
          with:
              fetch-depth: 0
              # We want to test our branch, not GitHub's fake merge commit (we must test that before merging anyway)
              # head_ref must be used for pull_request but for push and schedule events we have to use ref to get the branch name
              ref: ${{ github.head_ref || github.ref }}

        - name: Use Node.js 24
          uses: actions/setup-node@v5
          with:
              node-version: 24
              # v5 caches automatically when package.json has a `packageManager` field.
              # The node_modules cache below is the only cache we want.
              package-manager-cache: false

        # `github.action_path` only resolves inside this composite action, but the steps that use
        # .github/scripts/ live in the calling workflows. Resolving it once here and exposing it as
        # an output keeps the scripts readable in place, with no copy into a temp directory.
        # This is not a good place for this but me and Claude didn't figure out a better way.
        - name: Resolve scripts path
          id: scripts-path
          shell: bash
          run: echo "path=$(cd "${{ github.action_path }}/../../scripts" && pwd)" >> "$GITHUB_OUTPUT"

        - name: Cache dependencies npm
          id: check-dependencies-cache
          uses: actions/cache@v5
          with:
              path: node_modules
              key: modules-npm-${{ hashFiles('package-lock.json') }}

        - name: install npm dependencies
          if: steps.check-dependencies-cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              NPM_TOKEN: ${{ inputs.npm-token }}
              NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
          run: npm ci

        # The CLI is its own package (@apify/test-tools-cli), so the workflows install exactly the
        # version they ship with, in a folder of its own, and put its `apify-test-tools` command on
        # PATH. The repo's node_modules is left alone: the library its tests import stays whatever
        # its lockfile says, so a workflow release never upgrades a repo's test library behind its back.
        #
        # The workflows name the exact CLI version they ship with, so a tag is a complete statement:
        # these workflows and this CLI. A frozen major tag then keeps installing what it was tested
        # against however far the package moves on. A `>=` floor could not do that — being
        # open-ended, it resolves to the newest release forever, so freezing the tag would freeze the
        # workflow files but not their dependency. The stable release writes this file, so it always
        # names a published version; the release that publishes X is the commit that pins X.
        #
        # Branch testing: when the repo's lockfile holds a `-beta` of the library, the CLI with the
        # same version is installed instead. Both packages are released together under one version
        # number, so a beta of the library always has a matching beta of the CLI.
        #
        # Installed outside the repo, so the repo's own .npmrc does not apply and the public registry
        # is used. The token is still passed in case a runner-level .npmrc references it.
        - name: Install the test tools CLI required by these workflows
          shell: bash
          env:
              NPM_TOKEN: ${{ inputs.npm-token }}
              NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
          run: |
              locked_version=$(jq -r '.packages["node_modules/apify-test-tools"].version // empty' package-lock.json)
              echo "Package-lock version of apify-test-tools: ${locked_version:-none}"
              if [[ "$locked_version" == *"-beta"* ]]; then
                cli_version=$locked_version
                echo "Beta library detected, installing @apify/test-tools-cli@$cli_version to match it"
              else
                cli_version=$(cat "${{ github.action_path }}/../../workflows-package-version")
                echo "Installing @apify/test-tools-cli@$cli_version (pinned by these workflows)"
              fi
              cli_dir="$RUNNER_TEMP/apify-test-tools-cli"
              npm install --prefix "$cli_dir" "@apify/test-tools-cli@$cli_version" --audit=false --fund=false
              echo "$cli_dir/node_modules/.bin" >> "$GITHUB_PATH"
