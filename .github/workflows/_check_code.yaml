name: Code checks

on:
    workflow_call:

permissions:
    contents: read

jobs:
    actions_lint_check:
        name: Actions lint check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Run actionlint
              uses: rhysd/actionlint@v1.7.11

    # TODO: Fix spell check after we merge current PRs
    # spell_check:
    #     name: Spell check
    #     runs-on: ubuntu-latest
    #     steps:
    #         - name: Checkout repository
    #           uses: actions/checkout@v6
    #         - name: Check spelling with typos
    #           uses: crate-ci/typos@v1

    major_tag_refs:
        name: Major tag refs
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
            # `uses:` takes no expressions, so the major tag is repeated in every ref into this repo.
            # Missing one during a bump is silent while both tags exist: the new workflows quietly
            # run the old composite action.
            - name: Check refs match MAJOR_TAG
              run: node .github/scripts/check-major-tag-refs.mjs

    lint_check:
        name: Lint check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint

    type_check:
        name: Type check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'
            - name: Install dependencies
              run: npm ci
            - name: Type check
              run: npm run type-check

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build

    # The composite action runs the CLI and workflow helper bundles, which the pre-commit hook rebuilds.
    # This catches commits that skipped the hook, so stale bundles never ship.
    cli_bundle:
        name: CLI and workflow bundles
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'
            - name: Install dependencies
              run: npm ci
            - name: Check the bundle is up to date
              run: |
                  npm run bundle
                  if ! git diff --quiet -- .github/cli/ .github/scripts/run-with-apify-tokens.mjs; then
                      echo "::error::A CLI or workflow script bundle is out of date. Run \`npm run bundle\` and commit the result."
                      exit 1
                  fi
                  node .github/cli/apify-test-tools.mjs --help > /dev/null
