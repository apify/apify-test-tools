name: Platform tests

on:
    workflow_call:
        inputs:
            # Deprecated, use `test-files-glob`
            subtest:
                type: string
                default: ''
                required: false
            # Specify what tests you want to run, relative to `test/platform`
            test-files-glob:
                type: string
                default: ''
                required: false
            # Defaults to #notif-<repo-name> when empty, matching the previous behavior.
            report-slack-channel:
                type: string
                default: ''
                required: false

jobs:
    scheduledPlatformTests:
        name: Scheduled Platform tests
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Setup repository and dependencies
              # For testing, you have to temporarily change the branch
              uses: apify/apify-test-tools/.github/actions/checkout-restore-dependencies@workflows-v0
              with:
                  npm-token: ${{ secrets.NPM_TOKEN }}

            # Runs the repo's test code and its whole import graph, so it gets the tester token only.
            # Fails on failing tests, but writes the report anyway for the notification below.
            - name: Test
              env:
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
              run: |
                  apify-test-tools test --all ./test/platform/${{ inputs.test-files-glob || inputs.subtest }} \
                    --vitest-output-file ./test-output.json > test-report.json

            # Posts only when the tests failed, but checks the Slack token on every run
            - name: Notify
              if: ${{ !cancelled() }}
              env:
                  SLACK_TOKEN_TESTS_BOT: ${{ secrets.SLACK_TOKEN_TESTS_BOT }}
              run: |
                  apify-test-tools notify \
                    --slack-channel "${{ inputs.report-slack-channel || format('#notif-{0}', github.event.repository.name) }}" \
                    < test-report.json

            - name: Upload test reports
              uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: vitest-results
                  path: |
                      ./test-output.json
                      ./test-report.json
