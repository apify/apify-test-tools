name: CI (PR)

on:
    pull_request:

permissions:
    contents: read
    pull-requests: read

jobs:
    pr_title_check:
        name: PR title check
        runs-on: ubuntu-latest
        steps:
            - uses: apify/actions/pr-title-check@v1.6.1

    code_checks:
        name: Code checks
        uses: ./.github/workflows/_check_code.yaml

    tests:
        name: Tests
        uses: ./.github/workflows/_tests.yaml
        # Only the sandbox token, not `secrets: inherit`: the test job runs test code.
        secrets:
            E2E_TEST_APIFY_TOKEN_DBYPODOIHUZABNQTR: ${{ secrets.E2E_TEST_APIFY_TOKEN_DBYPODOIHUZABNQTR }}
