name: 'Platform tests: Claude failure investigation and fix'

# Notion page docs: https://app.notion.com/p/apify/374f39950a2280d99c89f27fc9fb49c5

# Reusable workflow that uses Claude Code to investigate a failing E2E platform test and
# attempt an automated fix.
#
# Two-phase execution:
#   1. investigate: Claude reviews test logs, recent workflow history, and existing issues,
#      then opens a GitHub issue with its findings. Skips silently if a duplicate exists.
#      On success, adds a "claude" label to the issue for visibility.
#   2. fix: Runs only when investigate created a new issue. Claude reads the issue,
#      implements a fix, and opens a PR. On success, adds a "claude:done" label to the issue.
#
# Note: this workflow is intended to be called from a scheduled workflow. Scheduled runs use
# GITHUB_TOKEN with reduced permissions that cannot trigger other workflow runs. For this reason
# the PR phase is chained as a direct job dependency rather than relying on a label-based trigger.
#
# Example usage:
#
# jobs:
#     platformTestsCore:
#         uses: apify/apify-test-tools/.github/workflows/public_platform-tests.yaml@workflows-v0
#         with:
#             subtest: core
#         secrets: inherit
#
#     handle-failure:
#         needs: platformTestsCore
#         if: ${{ failure() }}
#         uses: apify/apify-test-tools/.github/workflows/public_platform-tests-claude-investigate-and-fix.yaml@workflows-v0
#         secrets: inherit

on:
    workflow_call:
        inputs:
            model:
                required: false
                type: string
                default: sonnet
                description: Claude model to use for investigation and fix
            max_flakiness_runs:
                required: false
                type: number
                default: 200
                description: The most times Claude may re-run the failing Actor run to measure how often the failure happens, when that isn't obvious. Claude decides how many of them it needs.
            investigate_prompt:
                required: false
                type: string
                default: |
                    Investigate the failing E2E platform test and open a GitHub issue documenting your findings. Start by reviewing the test logs, error messages, and recent workflow run history to determine the root cause.

                    Use available tools to check previous workflow runs, git history, and existing GitHub issues to gather context and avoid creating duplicate issues. For deeper context,
                    use tools to investigate the run on Apify platform, review its logs, datasets, key-value stores.

                    Look specifically for debug traces, not just the top-level error:
                    - Debug snapshots: often stored as a field on dataset items (e.g. `_debugSnapshots`) or as records in a key-value store, keyed so they can be matched to the log line for the failing request.
                    - Any other debug artifacts the Actor produced (extra logs, error/state fields on output items) that narrow down the failing request.

                    Before you create a new issue, check whether the `platform-tests-investigate-and-fix:measure-flakiness` skill applies, and follow it if it does.

                    At the end of your investigation, before you create a new issue, follow the `platform-tests-investigate-and-fix:assess-impact` skill.

                    When you create the issue, write it like an incident postmortem: a short summary and impact up top for anyone skimming, full technical detail below for whoever fixes it. Don't water down the engineering detail to make the top readable.
                    - Title: short and clean, describing the actual problem in plain terms — no dates, run numbers, or other noise. Prefix it with a conventional-commit-style type, e.g. "fix: blocking issue on detail endpoint".
                    - Body, section 1 ("## Summary"): one line stating what's broken plus its impact, in plain language a PM can understand at a glance — no jargon, internal field names, or stack traces (e.g. "Scraping product detail pages fails when a listing has no reviews").
                    - If you measured flakiness, a "## Flakiness" section right after the Summary, as the `measure-flakiness` skill describes.
                    - An "## Impact" section under the Flakiness section (or under the Summary if there's none), as the `assess-impact` skill describes.
                    - A `---` divider, then section 2 ("## Details"): the engineering bug report — root cause, relevant log lines, links to the failing run, and any other internals an engineer needs. If a single item/request failed among otherwise-good ones, show or link that specific one (e.g. the dataset item index/id, or its matching debug snapshot) rather than just describing the run as failed.

                    If you create a new issue, you MUST write its issue number (just the number, nothing else) to $GITHUB_WORKSPACE/issue-number.txt as the very last thing you do. If you skip creating one because a duplicate already exists, do not create the file.
                description: Prompt given to Claude for the investigation phase. Override to customize how issues are investigated, titled, and described.
            priority_prompt:
                required: false
                type: string
                # The priority default thresholds below assume a run hitting the bug loses about 100% of its value when
                # catastrophic, 50% when high, 20% when medium and 5% when low (these numbers are rather arbitrary). Times the
                # revenue actually at risk, that's the expected monthly loss: Urgent from about 0.5% of the
                # cluster's revenue, High from 0.1% and Normal from 0.02% (again rather arbitrary).
                default: |
                    After you create a new issue and before you write its issue number to $GITHUB_WORKSPACE/issue-number.txt, set its Priority field from the failure's impact and flakiness:

                    1. Take the revenue actually at risk over the past month as a % of the cluster's revenue, as the `assess-impact` skill describes it.
                    2. Pick the priority by the relative severity and that %:
                        - Catastrophic: Urgent from 0.5%, High from 0.1%, Normal from 0.01%, Low below.
                        - High: Urgent from 2%, High from 0.5%, Normal from 0.1%, Low below.
                        - Medium: High from 2%, Normal from 0.5%, Low below.
                        - Low: Normal from 2%, Low below.
                        - Invisible to the user or Test: Low.

                    Priority is an organization-level issue field. If the revenue actually at risk can't be determined, e.g. the Impact section says "Cannot be determined", leave Priority unset, unless the relative severity is Invisible to the user or Test.
                description: Prompt given to Claude for setting a new issue's Priority field from its impact and flakiness. Override to customize the priority matrix, e.g. its revenue thresholds.
        secrets:
            ANTHROPIC_API_KEY:
                required: true
                description: Claude API key
            TESTER_APIFY_TOKEN:
                required: true
                description: Apify token for investigating the failing run — reading it, its log and its storages — and re-running it to measure how often the failure happens.
            NPM_TOKEN:
                required: false
                description: Read-only token for installing private npm packages before Claude runs.
            REDASH_API_KEY:
                required: false
                description: Redash API key for measuring the failure's impact — affected runs, high-touch customers and revenue — from Snowflake.
            AGENT_SKILLS_INTERNAL_GITHUB_TOKEN:
                required: false
                description: GitHub token with read access to apify/agent-skills-internal, for installing its redash-analyst plugin.

jobs:
    investigate:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
            issues: write
            actions: read
        outputs:
            issue_number: ${{ steps.issue.outputs.number }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Check which optional secrets are set
              id: optional-secrets
              run: |
                  echo "agent-skills-token=${{ secrets.AGENT_SKILLS_INTERNAL_GITHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
                  echo "redash-api-key=${{ secrets.REDASH_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

            - name: Checkout internal agent skills
              id: agent-skills-internal
              if: steps.optional-secrets.outputs.agent-skills-token == 'true'
              continue-on-error: true
              uses: actions/checkout@v5
              with:
                  repository: apify/agent-skills-internal
                  token: ${{ secrets.AGENT_SKILLS_INTERNAL_GITHUB_TOKEN }}
                  path: .agent-skills-internal
                  sparse-checkout: |
                      .claude-plugin
                      skills/redash-analyst
                  persist-credentials: false

            - uses: actions/setup-node@v6
              if: steps.optional-secrets.outputs.redash-api-key == 'true'
              with:
                  node-version: 24

            - name: Install Redash MCP server
              if: steps.optional-secrets.outputs.redash-api-key == 'true'
              continue-on-error: true
              working-directory: ${{ runner.temp }}
              run: npm install --prefix redash-mcp --ignore-scripts --no-audit --no-fund @suthio/redash-mcp@0.1.0

            - name: Run Claude Code
              id: claude
              uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1.0.213
              env:
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
                  REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
                  MAX_FLAKINESS_RUNS: ${{ inputs.max_flakiness_runs }}
              with:
                  prompt: |
                      The failing E2E platform test ran in workflow run ${{ github.run_id }} of this repo.

                      ${{ inputs.investigate_prompt }}

                      ${{ inputs.priority_prompt }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  plugin_marketplaces: |
                      https://github.com/apify/apify-test-tools.git
                      ${{ steps.agent-skills-internal.outcome == 'success' && format('{0}/.agent-skills-internal', github.workspace) || '' }}
                  plugins: |
                      platform-tests-investigate-and-fix@apify-test-tools
                      ${{ steps.agent-skills-internal.outcome == 'success' && 'redash-analyst@apify-agent-skills-internal' || '' }}
                  # The `tools` query parameter below selects which tools the Apify MCP server
                  # exposes: reading an Actor run — its status, exit code, storage ids and log — and
                  # reading that run's dataset items and its key-value store keys and records, e.g.
                  # INPUT, OUTPUT and error snapshots. WARN: the server adds `abort-actor-run` on top
                  # even when not listed here, see https://github.com/apify/apify-mcp-server
                  # `--disallowedTools` removes the Redash MCP server's tools that change Redash: creating,
                  # editing, sharing or deleting queries, visualizations, dashboards, widgets, alerts and snippets.
                  claude_args: |
                      --mcp-config '{"mcpServers":{"apify":{"type":"http","url":"https://mcp.apify.com/?tools=get-actor-run,get-actor-run-log,get-dataset-list,get-dataset,get-dataset-items,get-key-value-store-list,get-key-value-store,get-key-value-store-keys,get-key-value-store-record","headers":{"Authorization":"Bearer ${TESTER_APIFY_TOKEN}"}},"redash":{"type":"stdio","command":"${{ runner.temp }}/redash-mcp/node_modules/.bin/redash-mcp","env":{"REDASH_URL":"https://charts.apify.com/","REDASH_API_KEY":"${REDASH_API_KEY}"}}}}'
                      --disallowedTools mcp__redash__create_query,mcp__redash__update_query,mcp__redash__update_query_parameters,mcp__redash__archive_query,mcp__redash__fork_query,mcp__redash__add_query_favorite,mcp__redash__remove_query_favorite,mcp__redash__create_visualization,mcp__redash__update_visualization,mcp__redash__update_chart_visualization,mcp__redash__delete_visualization,mcp__redash__create_dashboard,mcp__redash__update_dashboard,mcp__redash__update_dashboard_parameters,mcp__redash__archive_dashboard,mcp__redash__fork_dashboard,mcp__redash__share_dashboard,mcp__redash__unshare_dashboard,mcp__redash__add_dashboard_favorite,mcp__redash__remove_dashboard_favorite,mcp__redash__create_alert,mcp__redash__update_alert,mcp__redash__delete_alert,mcp__redash__mute_alert,mcp__redash__add_alert_subscription,mcp__redash__remove_alert_subscription,mcp__redash__create_widget,mcp__redash__update_widget,mcp__redash__update_widget_layout,mcp__redash__update_dashboard_layout,mcp__redash__update_widget_parameter_mappings,mcp__redash__delete_widget,mcp__redash__create_query_snippet,mcp__redash__update_query_snippet,mcp__redash__delete_query_snippet
                      --model ${{ inputs.model }}
                      --dangerously-skip-permissions

            - name: Upload Claude output (for debugging)
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: claude-output-investigate
                  path: /home/runner/work/_temp/claude-execution-output.json

            - name: Read created issue
              id: issue
              # Claude writes the issue number to a file because there is no direct way to pass
              # structured output from a Claude Code action step to subsequent steps.
              run: |
                  if [ -f "$GITHUB_WORKSPACE/issue-number.txt" ]; then
                      ISSUE_NUMBER=$(cat "$GITHUB_WORKSPACE/issue-number.txt")
                      echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                      echo "Issue created: #$ISSUE_NUMBER"
                  else
                      echo "number=" >> "$GITHUB_OUTPUT"
                      echo "No issue created (duplicate skipped)"
                  fi

            # Adds the "claude" label for visibility. Normally this would trigger the claude.yaml
            # workflow, but scheduled runs lack the permissions to trigger other workflows, so the
            # PR phase is driven by the fix job dependency instead.
            - name: Add Claude label to issue
              if: steps.issue.outputs.number != ''
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      try {
                          await github.rest.issues.createLabel({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              name: "claude",
                              color: "d93f0b",
                          });
                      } catch (e) {
                          // Label already exists
                      }

                      await github.rest.issues.addLabels({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: parseInt('${{ steps.issue.outputs.number }}'),
                          labels: ["claude"],
                      });

    fix:
        needs: investigate
        if: needs.investigate.outputs.issue_number != ''
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
            actions: read
        steps:
            - name: Setup repository and dependencies
              uses: apify/apify-test-tools/.github/actions/checkout-restore-dependencies@workflows-v0
              with:
                  npm-token: ${{ secrets.NPM_TOKEN }}

            - name: Run Claude Code
              id: claude
              uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1.0.213
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  use_commit_signing: true
                  prompt: 'Open a pull request to address GitHub issue #${{ needs.investigate.outputs.issue_number }}. Use `gh issue view ${{ needs.investigate.outputs.issue_number }}` to read the issue details first, then implement the fix and create a PR.'
                  claude_args: |
                      --model ${{ inputs.model }}
                      --dangerously-skip-permissions

            - name: Upload Claude output (for debugging)
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: claude-output-fix
                  path: /home/runner/work/_temp/claude-execution-output.json

            # Adds "claude:done" to the issue to signal that a fix PR was opened. Pure status
            # tracking — does not trigger any further automation.
            - name: Mark issue as processed by Claude
              if: steps.claude.conclusion == 'success'
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      try {
                          await github.rest.issues.addLabels({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: parseInt('${{ needs.investigate.outputs.issue_number }}'),
                              labels: ['claude:done']
                          });
                          console.log('Label claude:done added to issue.');
                      } catch (e) {
                          console.log('Label claude:done does not exist. Skipping.');
                      }
