name: CI (master)

on:
    push:
        branches:
            - master
        tags-ignore:
            - '**'

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read
    actions: write

jobs:
    code_checks:
        name: Code checks
        uses: ./.github/workflows/_check_code.yaml

    tests:
        if: "!startsWith(github.event.head_commit.message, 'docs')"
        name: Tests
        uses: ./.github/workflows/_tests.yaml
        # Only the sandbox token, not `secrets: inherit`: the test job runs test code.
        secrets:
            E2E_TEST_APIFY_TOKEN_DBYPODOIHUZABNQTR: ${{ secrets.E2E_TEST_APIFY_TOKEN_DBYPODOIHUZABNQTR }}

    # Ships this push to consumer repos: the workflows and the CLI bundled in .github/cli/ go live
    # together. Independent of the npm release below, which only matters to people importing the lib.
    # `code_checks` runs actionlint and checks the bundle is up to date. `tests` cover the CLI but are
    # skipped for docs commits, so a skipped run does not hold the tag; a failed one does.
    move_major_tag:
        name: Move major version tag
        needs: [code_checks, tests]
        if: ${{ !failure() && !cancelled() }}
        permissions:
            contents: write
        uses: ./.github/workflows/_move_major_tag.yaml

    release_metadata:
        if: >-
            startsWith(github.event.head_commit.message, 'feat') ||
            startsWith(github.event.head_commit.message, 'fix') ||
            startsWith(github.event.head_commit.message, 'perf') ||
            startsWith(github.event.head_commit.message, 'refactor') ||
            startsWith(github.event.head_commit.message, 'chore') ||
            startsWith(github.event.head_commit.message, 'style')
        name: Update pre-release metadata
        needs: [code_checks, tests]
        permissions:
            contents: write
        uses: ./.github/workflows/_update_release_metadata.yaml
        secrets: inherit
        with:
            release_type: prerelease

    npm_publish:
        name: NPM publish
        needs: [release_metadata]
        runs-on: ubuntu-latest
        steps:
            - name: Execute publish workflow
              uses: apify/actions/execute-workflow@v1.1.2
              with:
                  workflow: manual_publish_to_npm.yaml
                  inputs: >
                      {
                          "ref": "${{ needs.release_metadata.outputs.changelog_commitish }}",
                          "tag": "beta"
                      }
