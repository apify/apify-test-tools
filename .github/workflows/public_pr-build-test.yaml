name: Test

on:
    workflow_call:
        inputs:
            skip-platform-tests:
                type: boolean
                default: false
                required: false
            # Legacy: what tests to run, relative to `test/platform` (e.g. '{daily,hourly}/'). Prefer test-files-path-glob.
            test-files-glob:
                type: string
                default: ''
                required: false
            # Platform test files, as a glob relative to the repo root (e.g. '**/*.platform.test.ts').
            # Takes precedence over test-files-glob. Defaults to 'test/platform/**'.
            test-files-path-glob:
                type: string
                default: ''
                required: false

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    platformTest:
        if: ${{ !inputs.skip-platform-tests }}
        runs-on: ubuntu-latest
        steps:
            - name: Setup repository and dependencies
              id: setup
              # For testing, you have to temporarily change the branch
              uses: apify/apify-test-tools/.github/actions/checkout-restore-dependencies@workflows-v0
              with:
                  # Some repos use private npm packages, they need to pass NPM_TOKEN secret to this workflow
                  npm-token: ${{ secrets.NPM_TOKEN }}

            - name: Resolve test files glob
              id: test_glob
              env:
                  PATH_GLOB: ${{ inputs.test-files-path-glob }}
                  LEGACY_GLOB: ${{ inputs.test-files-glob }}
              run: |
                  if [ -n "$PATH_GLOB" ]; then
                    glob="$PATH_GLOB"
                  elif [ -n "$LEGACY_GLOB" ]; then
                    glob="test/platform/${LEGACY_GLOB%/}{,/**}"
                  else
                    glob="test/platform/**"
                  fi
                  echo "glob=$glob" | tee -a "$GITHUB_OUTPUT"

            - name: Pick last validated commit from cache
              id: base_commit
              uses: actions/cache@v5
              with:
                  # We have to call it base commit for the library but it makes more sense as "last validated commit"
                  # Using run_id ensures the key is always unique so the cache always saves at end-of-job (no "cache hit, not saving" issue)
                  path: ./base_commit.txt
                  key: base_commit-${{ github.run_id }}
                  # This is needed to force overriding the cache with new entry at the end
                  restore-keys: base_commit-

            # run-with-apify-tokens.mjs reads the token names from in apify-test-tools.config.json
            # and hands the build those secrets and nothing else, so the tokens stay in this one command instead of the whole job.
            # The library never sees secrets it doesn't need
            - name: Build
              id: build
              env:
                  ALL_SECRETS: ${{ toJSON(secrets) }}
                  # Branch names are attacker-controlled on fork PRs, so they reach the script as
                  # environment variables rather than being interpolated into it.
                  HEAD_REF: ${{ github.head_ref }}
                  BASE_REF: ${{ github.base_ref }}
                  SCRIPTS_PATH: ${{ steps.setup.outputs.scripts-path }}
                  TEST_FILES_GLOB: ${{ steps.test_glob.outputs.glob }}
              run: |
                  base_commit=$(cat base_commit.txt 2>/dev/null || echo "")
                  echo "Last validated (base) commit to be used for build & test: $base_commit"
                  args=(
                    --source-branch "origin/$HEAD_REF"
                    --target-branch "origin/$BASE_REF"
                    --test-files-glob "$TEST_FILES_GLOB"
                    --use-docker-cache
                  )
                  [ -n "$base_commit" ] && args+=(--base-commit "$base_commit")
                  actor_builds=$(node "$SCRIPTS_PATH/run-with-apify-tokens.mjs" \
                    npx apify-test-tools build "${args[@]}")
                  echo "actor_builds=$actor_builds" | tee -a "$GITHUB_OUTPUT"

            # Test files never trigger a build, so a test-only push builds nothing. Run the changed tests against
            # the deployed builds instead, but only if the branch changes no Actor code: the deployed builds lack it.
            - name: Find changed platform tests
              id: changed_tests
              env:
                  # Branch names are attacker-controlled on fork PRs, so they reach the script as
                  # environment variables rather than being interpolated into it.
                  HEAD_REF: ${{ github.head_ref }}
                  BASE_REF: ${{ github.base_ref }}
                  TEST_FILES_GLOB: ${{ steps.test_glob.outputs.glob }}
                  ACTOR_BUILDS: ${{ steps.build.outputs.actor_builds }}
              run: |
                  base_commit=$(cat base_commit.txt 2>/dev/null || echo "")
                  args=(
                    --source-branch "origin/$HEAD_REF"
                    --target-branch "origin/$BASE_REF"
                    --test-files-glob "$TEST_FILES_GLOB"
                  )
                  [ -n "$base_commit" ] && args+=(--base-commit "$base_commit")
                  changed=$(npx apify-test-tools get-changed-tests "${args[@]}" | jq -c 'map("./" + .)')
                  if [ "$changed" = "[]" ]; then
                    exit 0
                  fi
                  if [ "$ACTOR_BUILDS" != "[]" ]; then
                    echo "::notice title=Changed platform tests::Only tests of the rebuilt Actors run. Changed tests did not run separately: $changed"
                    exit 0
                  fi

                  # No --base-commit, so Actor code validated at an earlier commit counts too
                  branch_actors=$(npx apify-test-tools get-affected-actors \
                    --source-branch "origin/$HEAD_REF" \
                    --target-branch "origin/$BASE_REF" \
                    --test-files-glob "$TEST_FILES_GLOB" | jq -r 'map(.actorFullName) | join(", ")')
                  if [ -z "$branch_actors" ]; then
                    echo "target=$changed" | tee -a "$GITHUB_OUTPUT"
                  else
                    msg="Changed platform tests did NOT run: $changed. The branch changes $branch_actors, which the deployed builds lack. Re-run this job from scratch to rebuild and test together."
                    echo "::warning title=Changed platform tests did not run::$msg"
                    echo "$msg" >> "$GITHUB_STEP_SUMMARY"
                  fi

            # Runs the repo's test code and its whole import graph, so it gets the tester token only.
            - name: Test
              env:
                  ACTOR_BUILDS: ${{ steps.build.outputs.actor_builds }}
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
                  # No build to pin to, so lift the per-actor gate and let each run use the deployed build.
                  RUN_ALL_PLATFORM_TESTS: ${{ steps.changed_tests.outputs.target && '1' || '' }}
                  CHANGED_TESTS: ${{ steps.changed_tests.outputs.target }}
                  TEST_FILES_PATH_GLOB: ${{ inputs.test-files-path-glob }}
              run: |
                  opts=(--run --maxConcurrency 20 --fileParallelism=true --maxWorkers 100)
                  if [ -n "$CHANGED_TESTS" ]; then
                    # `related` runs the tests that import each changed file, so a changed helper runs its dependents.
                    # A plain filter would match no test for a helper and exit 1; `related` exits 0 when nothing imports it.
                    mapfile -t changed_tests < <(jq -r '.[]' <<< "$CHANGED_TESTS")
                    npx vitest related "${changed_tests[@]}" "${opts[@]}"
                  elif [ -n "$TEST_FILES_PATH_GLOB" ]; then
                    mapfile -t files < <(npx apify-test-tools get-test-files --test-files-glob "$TEST_FILES_PATH_GLOB" | jq -r '.[] | "./" + .')
                    if [ ${#files[@]} -eq 0 ]; then
                      echo "::error::No file matches test-files-path-glob '$TEST_FILES_PATH_GLOB'"
                      exit 1
                    fi
                    npx vitest "${files[@]}" "${opts[@]}"
                  else
                    npx vitest ./test/platform/${{ inputs.test-files-glob }} "${opts[@]}"
                  fi

            # NOTE: This is an optimization that if we did functional changes and later only cosmetic changes (e.g. dev readme), we will compare changes files only for the last commit. This must run after tests because we want to cache the latest commit only if the tests are successful
            - name: Store last validated commit to cache
              env:
                  HEAD_REF: ${{ github.head_ref }}
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  base_commit=$(cat base_commit.txt 2>/dev/null || echo "")
                  echo "Old last validated (base) commit: $base_commit"
                  args=(
                    --source-branch "origin/$HEAD_REF"
                    --target-branch "origin/$BASE_REF"
                  )
                  [ -n "$base_commit" ] && args+=(--base-commit "$base_commit")
                  npx apify-test-tools get-latest-commit "${args[@]}" > ./base_commit.txt
                  echo "New last validated (base) commit: $(cat base_commit.txt)"

    # Pure static checks against the repo. Needs no Apify or Slack credentials, only the npm
    # token to install dependencies.
    unitTest:
        # TODO: only run on changes to code
        runs-on: ubuntu-latest
        steps:
            - name: Setup repository and dependencies
              # For testing, you have to temporarily change the branch
              uses: apify/apify-test-tools/.github/actions/checkout-restore-dependencies@workflows-v0
              with:
                  npm-token: ${{ secrets.NPM_TOKEN }}

            - name: TypeScript
              # Some repos require custom build checks, so we check if the `build-check` script exists and run it if
              # it does. Otherwise default to the standard `npx tsc --noEmit` check
              run: |
                  HAS_CUSTOM_BUILD_CHECK=$(jq -r '.scripts["build-check"] // empty' package.json)
                  if [ -n "$HAS_CUSTOM_BUILD_CHECK" ]; then
                      echo "Custom build check script found. Running it.";
                      npm run build-check;
                  else
                      echo "No custom build check script found. Running standard tsc --noEmit.";
                      npx tsc --noEmit;
                  fi

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Formatter Check
              run: |
                  HAS_FORMAT_CHECK_SCRIPT=$(jq -r '.scripts["format:check"] // empty' package.json)
                  if [ -n "$HAS_FORMAT_CHECK_SCRIPT" ]; then
                      echo "Custom format:check script found. Running it.";
                      npm run format:check;
                  elif [ -d "node_modules/prettier" ]; then
                      echo "Prettier is installed. Running prettier --check .";
                      npx prettier --check .;
                  else
                      echo "Prettier is not installed. Skipping Prettier check.";
                  fi

            - name: Unused Exports Check
              run: |
                  HAS_CHECK_UNUSED_SCRIPT=$(jq -r '.scripts["check-unused"] // empty' package.json)
                  if [ -n "$HAS_CHECK_UNUSED_SCRIPT" ]; then
                      echo "Custom check-unused script found. Running it.";
                      npm run check-unused;
                  elif [ -d "node_modules/knip" ]; then
                      echo "Knip is installed. Running knip to check for unused exports.";
                      npx knip --include exports,types;
                  elif [ -d "node_modules/ts-unused-exports" ]; then
                      echo "Knip is not installed, but ts-unused-exports is. Running ts-unused-exports to check for unused exports.";
                      npx ts-unused-exports ./tsconfig.json;
                  else
                      echo "knip nor ts-unused-exports are installed. Skipping unused exports check.";
                  fi
