name: Checkout and restore dependencies
description: Checkout and restore dependencies
inputs:
    npm-token:
        description: >-
            Token for installing private npm packages. Exported as both NPM_TOKEN (what a
            committed .npmrc usually references) and NODE_AUTH_TOKEN (what setup-node's
            generated .npmrc references), and only on the dependency install steps, so it
            never reaches the build or test steps. Use a read-only token.
        required: false

outputs:
    scripts-path:
        description: >-
            Absolute path to this repo's scripts/ directory in the runner's action checkout.
            Lets calling workflows run helpers like run-with-apify-tokens.mjs without checking
            this repo out again, since the workspace holds the caller's repo, not this one.
        value: ${{ steps.scripts-path.outputs.path }}

# Sets common steps and ensure we use cached node_modules
# To test a change here, repoint the `uses:` refs in the reusable workflows at your branch, and
# change them back before merging. Merging to master no longer ships it: consumers track the `workflows-v0`
# tag, which only moves once the package version in .github/workflows-package-version is on npm.
runs:
    using: 'composite'
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v5
          with:
              fetch-depth: 0
              # We want to test our branch, not GitHub's fake merge commit (we must test that before merging anyway)
              # head_ref must be used for pull_request but for push and schedule events we have to use ref to get the branch name
              ref: ${{ github.head_ref || github.ref }}

        - name: Use Node.js 24
          uses: actions/setup-node@v5
          with:
              node-version: 24
              # v5 caches automatically when package.json has a `packageManager` field.
              # The caches below are the only ones we want.
              package-manager-cache: false

        # `github.action_path` only resolves inside this composite action, but the steps that use
        # .github/scripts/ live in the calling workflows. Resolving it once here and exposing it as
        # an output keeps the scripts readable in place, with no copy into a temp directory.
        # This is not a good place for this but me and Claude didn't figure out a better way.
        - name: Resolve scripts path
          id: scripts-path
          shell: bash
          run: echo "path=$(cd "${{ github.action_path }}/../../scripts" && pwd)" >> "$GITHUB_OUTPUT"

        - name: Cache dependencies npm
          id: check-dependencies-cache
          uses: actions/cache@v5
          with:
              path: node_modules
              key: modules-npm-${{ hashFiles('package-lock.json') }}

        - name: install npm dependencies
          if: steps.check-dependencies-cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              NPM_TOKEN: ${{ inputs.npm-token }}
              NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
          run: npm ci

        # The CLI the workflows call is installed apart from the repo's node_modules, which stays
        # exactly what package-lock.json says. The repo's tests import the lib from the version they
        # locked, so a lib change in a newer release can't reach them (or bump their vitest through
        # our peer dependency), while the CLI is still the one these workflows were tested against.
        - name: Resolve apify-test-tools CLI version
          id: cli
          shell: bash
          run: |
              locked_version=$(jq -r '.packages["node_modules/apify-test-tools"].version // empty' package-lock.json)
              echo "Package-lock version of apify-test-tools: ${locked_version:-none}"
              if [[ "$locked_version" == *"-beta"* ]]; then
                # A locked beta is how a branch-specific version of apify-test-tools gets tested,
                # so the CLI follows it instead of the pin.
                version="$locked_version"
                echo "Beta version detected, using apify-test-tools@$version for the CLI"
              else
                # The workflows name the exact package version they ship with, so a tag is a complete
                # statement: these workflows and this library. A frozen major tag then keeps
                # installing what it was tested against however far the package moves on. A `>=`
                # floor could not do that — being open-ended, it resolves to the newest release
                # forever, so freezing the tag would freeze the workflow files but not their
                # dependency. The stable release writes this file, so it always names a published
                # version; the release that publishes X is the commit that pins X.
                version=$(cat "${{ github.action_path }}/../../workflows-package-version")
                echo "Using apify-test-tools@$version for the CLI (pinned by these workflows)"
              fi
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "dir=$RUNNER_TEMP/apify-test-tools-cli" >> "$GITHUB_OUTPUT"
              # hashFiles() only sees the workspace, not this action's checkout.
              echo "lock-hash=$(sha256sum "${{ github.action_path }}/../../cli/package-lock.json" | cut -c1-16)" >> "$GITHUB_OUTPUT"

        # Bump the v1 when install-cli.sh changes how it installs, so caches made the old way are not reused.
        - name: Cache apify-test-tools CLI
          id: cli-cache
          uses: actions/cache@v5
          with:
              path: ${{ steps.cli.outputs.dir }}
              key: apify-test-tools-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cli.outputs.version }}-${{ steps.cli.outputs.lock-hash }}

        # Installs from .github/cli/package-lock.json, so nothing is resolved from the registry and every
        # dependency is checked against its integrity hash. See install-cli.sh.
        # Needs the npm token too: a repo whose .npmrc routes all traffic through a private
        # registry has to authenticate even for public packages.
        - name: Install apify-test-tools CLI
          if: steps.cli-cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              NPM_TOKEN: ${{ inputs.npm-token }}
              NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
          run: bash "${{ github.action_path }}/../../scripts/install-cli.sh" "${{ steps.cli.outputs.version }}" "${{ steps.cli.outputs.dir }}"

        # Steps call `apify-test-tools` without npx: npx would pick the repo's own copy in node_modules/.bin first.
        - name: Put apify-test-tools CLI on PATH
          shell: bash
          env:
              CLI_DIR: ${{ steps.cli.outputs.dir }}
          run: |
              installed_version=$(jq -r .version "$CLI_DIR/node_modules/apify-test-tools/package.json")
              echo "apify-test-tools CLI version: $installed_version"
              echo "$CLI_DIR/bin" >> "$GITHUB_PATH"
