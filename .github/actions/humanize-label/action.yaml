name: Label who humanizes an issue
description: >-
    Labels an issue `<prefix>:<login>` with the next developer from the `*` rule of the repo's CODEOWNERS,
    in turn. See workflow-scripts-src/humanize-label.ts.
inputs:
    label-prefix:
        description: Label prefix; the label is `<label-prefix>:<login>`.
        required: true
    issue-number:
        description: Issue to label.
        required: true
    github-token:
        description: Token that can read the repo's contents and write its issues.
        required: false
        default: ${{ github.token }}

# The script ships with this action as a bundle (npm run bundle), so nothing is checked out or installed.
runs:
    using: 'composite'
    steps:
        - name: Label the issue
          uses: actions/github-script@v9
          env:
              LABEL_PREFIX: ${{ inputs.label-prefix }}
              ISSUE_NUMBER: ${{ inputs.issue-number }}
              SCRIPT_PATH: ${{ github.action_path }}/../../scripts/humanize-label.mjs
          with:
              github-token: ${{ inputs.github-token }}
              script: |
                  const { assignHumanizeLabel } = await import(process.env.SCRIPT_PATH);
                  await assignHumanizeLabel({
                      github,
                      context,
                      core,
                      prefix: process.env.LABEL_PREFIX,
                      issueNumber: Number(process.env.ISSUE_NUMBER),
                  });
