name: Test

on:
    workflow_call:
        inputs:
            skip-platform-tests:
                type: boolean
                default: false
                required: false
            # Glob of the test files to run, from the repo root, e.g. `test/platform/{daily,hourly}/**`. Which changed
            # files count as test changes is `platformTestsGlob` in apify-test-tools.config.json, not this.
            test-files-glob:
                type: string
                default: 'test/platform/**'
                required: false
            # Fail the build unless the env var names of version 0.99 match the default version's
            require-env-vars-in-sync:
                type: boolean
                default: true
                required: false
        # Every secret is optional. The ones this workflow reads are declared by name. The secrets that
        # apify-test-tools.config.json names (e.g. each Actor's `tokenEnvVar`) differ per repo, so they
        # come packed in CONFIG_SECRETS. See the Secrets section of docs/workflows.md.
        secrets:
            NPM_TOKEN:
                required: false
                description: Read-only token for installing private npm packages.
            TESTER_APIFY_TOKEN:
                required: false
                description: Apify token the platform tests run Actors with.
            CONFIG_SECRETS:
                required: false
                description: >-
                    JSON object of the secrets apify-test-tools.config.json names, secret name -> value.
                    Today that is each Actor's `tokenEnvVar`. Passing `toJSON(secrets)` works too, only
                    the names the config declares are used.

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    platformTest:
        if: ${{ !inputs.skip-platform-tests }}
        runs-on: ubuntu-latest
        steps:
            - name: Setup repository and dependencies
              id: setup
              # `$/` loads the action from this repo at the commit this workflow was called at, so a caller
              # pinned to a SHA or a branch gets that commit's action and CLI, not whatever the major tag is on.
              uses: $/.github/actions/checkout-restore-dependencies
              with:
                  # Some repos use private npm packages, they need to pass NPM_TOKEN secret to this workflow
                  npm-token: ${{ secrets.NPM_TOKEN }}
                  config-secrets: ${{ secrets.CONFIG_SECRETS }}

            # Fails here with a clear message rather than deep in vitest. `required: true` alone doesn't
            # catch it: a caller can list the secret while the repo doesn't have it, and PRs from forks
            # never get secrets.
            - name: Check TESTER_APIFY_TOKEN
              env:
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
              run: |
                  if [ -z "$TESTER_APIFY_TOKEN" ]; then
                      echo "::error::TESTER_APIFY_TOKEN is empty. Pass it in the secrets: block of the job that calls this workflow."
                      exit 1
                  fi

            # The builds this PR made and tested are kept with it, so a later push that only changes tests reuses them
            - name: Pick last validated commit and its builds from cache
              id: base_commit
              uses: actions/cache@v5
              with:
                  # We have to call it base commit for the library but it makes more sense as "last validated commit"
                  # Using run_id ensures the key is always unique so the cache always saves at end-of-job (no "cache hit, not saving" issue)
                  path: |
                      ./base_commit.txt
                      ./pr-builds.json
                  key: base_commit-${{ github.run_id }}
                  # This is needed to force overriding the cache with new entry at the end
                  restore-keys: base_commit-

            # Needs no tokens, it only reads git and apify-test-tools.config.json. The setup action checks out
            # the PR branch itself (not GitHub's merge commit), so the range ends at the branch's HEAD.
            - name: Find affected Actors
              env:
                  # Branch names are attacker-controlled on fork PRs, so they reach the script as
                  # environment variables rather than being interpolated into it.
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  base_commit=$(cat base_commit.txt 2>/dev/null || echo "")
                  echo "Last validated (base) commit to be used for build & test: $base_commit"
                  args=(--base "origin/$BASE_REF")
                  [ -n "$base_commit" ] && args+=(--since "$base_commit")
                  # Actors with only test changes get the build that runs their tests in testChangedActors: the
                  # default build, or the build an earlier run of this PR made and stored in pr-builds.json
                  apify-test-tools get-affected-actors "${args[@]}" --stored-builds pr-builds.json > affected.json

            # Narrows the Actors with test changes to those the changed tests name, each to its changed test files.
            # `vitest list` follows imports, so a changed helper selects the tests that use it. When it can't tell
            # for certain (e.g. a changed JSON fixture), every test of those Actors runs. It loads the repo's test
            # code, so it gets the tester token only, like the Test step.
            - name: Select changed tests
              env:
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
              run: apify-test-tools select-changed-tests < affected.json > changed-tests.json

            # Functional changes are built into the test version 0.99 that users never run. Actors with only test
            # changes reuse the build listed with them while it still exists, and are built otherwise. Cosmetic-only
            # changes need no tests. The output lists every build to test, new and reused. Actors with only test
            # changes keep their changed test files as `testFiles`, so only those of their tests run.
            # run-with-apify-tokens.mjs reads the token names from in apify-test-tools.config.json
            # and hands the build those secrets and nothing else, so the tokens stay in this one command instead of the whole job.
            # The library never sees secrets it doesn't need
            - name: Build
              # bash rather than the default shell, for pipefail
              shell: bash
              env:
                  WORKFLOW_SECRETS: ${{ toJSON(secrets) }}
                  SCRIPTS_PATH: ${{ steps.setup.outputs.scripts-path }}
                  REQUIRE_ENV_VARS_IN_SYNC: ${{ inputs.require-env-vars-in-sync }}
              run: |
                  jq '{ actors: (.functionallyChangedActors + .testChangedActors) }' changed-tests.json \
                    | node "$SCRIPTS_PATH/run-with-apify-tokens.mjs" apify-test-tools build --version-number 0.99 \
                        --require-env-vars-in-sync="$REQUIRE_ENV_VARS_IN_SYNC" \
                    | tee builds.json

            # Runs the repo's test code and its whole import graph, so it gets the tester token only.
            - name: Test
              env:
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
                  # Passed through the environment and quoted, so the shell doesn't expand the glob itself
                  # An empty input, e.g. from an expression that picks the glob, runs everything, like the default
                  TEST_FILES_GLOB: ${{ inputs.test-files-glob || 'test/platform/**' }}
              # The github-actions reporter annotates the PR with the failing tests
              run: |
                  apify-test-tools test --test-files-glob "$TEST_FILES_GLOB" --reporter github-actions \
                    < builds.json > test-report.json

            # NOTE: This is an optimization that if we did functional changes and later only cosmetic changes (e.g. dev readme), we will compare changes files only for the last commit. This must run after tests because we want to cache the latest commit only if the tests are successful
            # The builds are stored with the commit, so the next run knows which builds have the validated code.
            - name: Store last validated commit and its builds to cache
              run: |
                  echo "Old last validated (base) commit: $(cat base_commit.txt 2>/dev/null || echo "")"
                  # The HEAD that was just built and tested
                  jq -r .head affected.json > base_commit.txt
                  echo "New last validated (base) commit: $(cat base_commit.txt)"
                  # The builds this run tested replace the stored builds of the same Actors, and the other stored
                  # builds stay: those Actors didn't change since. INDEX keys the builds by Actor, the later one wins.
                  # touch: on the first run there are no stored builds, and jq -s reads an empty file as nothing.
                  touch pr-builds.json
                  jq -s 'add | INDEX(.actorFullName) | [.[]]' pr-builds.json builds.json > pr-builds.next.json
                  mv pr-builds.next.json pr-builds.json

    # Pure static checks against the repo. Needs no Apify or Slack credentials, only the npm
    # token to install dependencies.
    unitTest:
        # TODO: only run on changes to code
        runs-on: ubuntu-latest
        steps:
            - name: Setup repository and dependencies
              # `$/` loads the action from this repo at the commit this workflow was called at, so a caller
              # pinned to a SHA or a branch gets that commit's action and CLI, not whatever the major tag is on.
              uses: $/.github/actions/checkout-restore-dependencies
              with:
                  npm-token: ${{ secrets.NPM_TOKEN }}

            - name: TypeScript
              # Some repos require custom build checks, so we check if the `build-check` script exists and run it if
              # it does. Otherwise default to the standard `npx tsc --noEmit` check
              run: |
                  HAS_CUSTOM_BUILD_CHECK=$(jq -r '.scripts["build-check"] // empty' package.json)
                  if [ -n "$HAS_CUSTOM_BUILD_CHECK" ]; then
                      echo "Custom build check script found. Running it.";
                      npm run build-check;
                  else
                      echo "No custom build check script found. Running standard tsc --noEmit.";
                      npx tsc --noEmit;
                  fi

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Formatter Check
              run: |
                  HAS_FORMAT_CHECK_SCRIPT=$(jq -r '.scripts["format:check"] // empty' package.json)
                  if [ -n "$HAS_FORMAT_CHECK_SCRIPT" ]; then
                      echo "Custom format:check script found. Running it.";
                      npm run format:check;
                  elif [ -d "node_modules/prettier" ]; then
                      echo "Prettier is installed. Running prettier --check .";
                      npx prettier --check .;
                  else
                      echo "Prettier is not installed. Skipping Prettier check.";
                  fi

            - name: Unused Exports Check
              run: |
                  HAS_CHECK_UNUSED_SCRIPT=$(jq -r '.scripts["check-unused"] // empty' package.json)
                  if [ -n "$HAS_CHECK_UNUSED_SCRIPT" ]; then
                      echo "Custom check-unused script found. Running it.";
                      npm run check-unused;
                  elif [ -d "node_modules/knip" ]; then
                      echo "Knip is installed. Running knip to check for unused exports.";
                      npx knip --include exports,types;
                  elif [ -d "node_modules/ts-unused-exports" ]; then
                      echo "Knip is not installed, but ts-unused-exports is. Running ts-unused-exports to check for unused exports.";
                      npx ts-unused-exports ./tsconfig.json;
                  else
                      echo "knip nor ts-unused-exports are installed. Skipping unused exports check.";
                  fi
