name: Move major version tag

# Escape hatch for what the automatic move on master pushes does not cover: rolling the tag back to
# an earlier commit when a shipped workflow or CLI turns out to be broken, or moving it after a push
# whose checks failed for an unrelated reason.

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Commit, branch or tag to move the major tag to (defaults to master)
                required: false
                type: string
                default: ''

permissions:
    contents: read

jobs:
    move_major_tag:
        name: Move major version tag
        permissions:
            contents: write
        uses: ./.github/workflows/_move_major_tag.yaml
        with:
            ref: ${{ inputs.ref }}
