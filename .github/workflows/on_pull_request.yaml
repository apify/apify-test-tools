name: CI (PR)

on:
    pull_request:

permissions:
    contents: read
    pull-requests: read

jobs:
    pr_title_check:
        name: PR title check
        runs-on: ubuntu-latest
        steps:
            - uses: apify/actions/pr-title-check@v1.6.1

    code_checks:
        name: Code checks
        uses: ./.github/workflows/_check_code.yaml

    tests:
        name: Tests
        uses: ./.github/workflows/_tests.yaml

    e2e:
        name: E2E
        uses: ./.github/workflows/_e2e.yaml
        secrets: inherit
        # A new push supersedes the previous run of the same PR, including one queued for the sandbox.
        concurrency:
            group: e2e-${{ github.event.pull_request.number }}
            cancel-in-progress: true

    # Catches the one combination that breaks consumers: a workflow starting to use a CLI feature
    # from the same PR. Merging ships the workflow immediately, so the pinned version has to move in
    # the same change or the workflow goes live calling something that is not published.
    package_version_bump_needed:
        name: Package version bump needed
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Check whether this PR needs a version bump
              env:
                  BASE_REF: ${{ github.base_ref }}
                  PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
              run: |
                  git fetch --no-tags origin "$BASE_REF"
                  git diff --name-only FETCH_HEAD...HEAD | node .github/scripts/check-package-version-bump.mjs

    # Reports whether merging this PR will ship the workflows or hold the major tag until a release.
    # Never fails: pinning a version ahead of the release that publishes it is a supported way to
    # land the package change and the workflow change that needs it in one PR.
    workflows_package_version:
        name: Workflows package version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Check the pinned package version is published
              run: |
                  pinned_version=$(cat .github/workflows-package-version)
                  if npm view "apify-test-tools@$pinned_version" version >/dev/null 2>&1; then
                      echo "Workflows pin apify-test-tools@$pinned_version, which is published."
                      echo "The major tag moves on merge and these workflows go live." >> "$GITHUB_STEP_SUMMARY"
                  else
                      {
                          echo "### Major tag will be held on merge"
                          echo
                          echo "These workflows pin \`apify-test-tools@$pinned_version\`, which is not on npm yet."
                          echo "Merging is fine: consumers keep running the current workflows until you cut a"
                          echo "stable release, and the tag moves once that version is published."
                      } >> "$GITHUB_STEP_SUMMARY"
                      echo "::notice::Merging will not ship these workflows until apify-test-tools $pinned_version is released."
                  fi
