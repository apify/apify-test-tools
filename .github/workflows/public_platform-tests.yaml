name: Platform tests

on:
    workflow_call:
        inputs:
            # Deprecated, use `test-files-glob`
            subtest:
                type: string
                default: ''
                required: false
            # Specify what tests you want to run, relative to `test/platform`
            test-files-glob:
                type: string
                default: ''
                required: false
            # Defaults to #notif-<repo-name> when empty, matching the previous behavior.
            report-slack-channel:
                type: string
                default: ''
                required: false
        # Only TESTER_APIFY_TOKEN is required, every test needs it. See the Secrets section of docs/workflows.md.
        secrets:
            NPM_TOKEN:
                required: false
                description: Read-only token for installing private npm packages.
            TESTER_APIFY_TOKEN:
                required: true
                description: Apify token the platform tests run Actors with.
            SLACK_TOKEN_TESTS_BOT:
                required: false
                description: Slack token for reporting test results.

jobs:
    scheduledPlatformTests:
        name: Scheduled Platform tests
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Setup repository and dependencies
              # For testing, you have to temporarily change the branch
              uses: apify/apify-test-tools/.github/actions/checkout-restore-dependencies@claude/zen-mayer-7md3vw
              with:
                  npm-token: ${{ secrets.NPM_TOKEN }}

            # Fails here with a clear message rather than deep in vitest. `required: true` alone doesn't
            # catch it: a caller can list the secret while the repo doesn't have it, and PRs from forks
            # never get secrets.
            - name: Check TESTER_APIFY_TOKEN
              env:
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
              run: |
                  if [ -z "$TESTER_APIFY_TOKEN" ]; then
                      echo "::error::TESTER_APIFY_TOKEN is empty. Pass it in the secrets: block of the job that calls this workflow."
                      exit 1
                  fi

            - name: Test
              env:
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
                  SLACK_TOKEN_TESTS_BOT: ${{ secrets.SLACK_TOKEN_TESTS_BOT }}
              run: |
                  set +e
                  export RUN_ALL_PLATFORM_TESTS=1
                  npx vitest ./test/platform/${{ inputs.test-files-glob || inputs.subtest }} \
                    --run \
                    --reporter=default \
                    --reporter=json \
                    --outputFile=./test-output.json \
                    --maxConcurrency 20 \
                    --fileParallelism=true \
                    --maxWorkers 100
                  return_code=$?
                  apify-test-tools report-tests \
                    --report-file ./test-output.json \
                    --workflow-name "${{ github.workflow }}" \
                    --job-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                    --report-slack-channel "${{ inputs.report-slack-channel || format('#notif-{0}', github.event.repository.name) }}"
                  exit $return_code

            - name: Upload Vitest JSON artifact
              uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: vitest-results
                  path: ./test-output.json
